[project]
name = "fie"
version = "0.1.0"
description = "Financial Intelligence Engine — multi-agent verification over SEC filings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Arnobgr", email = "90406956+Arnobgr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "edgartools>=5.61.1",
    "fastapi>=0.120",
    "fastembed>=0.5",
    "httpx>=0.27",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.3.5",
    "langfuse>=4.14.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "lxml>=5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "structlog>=25.4",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.40",
]

[project.scripts]
fie = "fie.cli:app"
eval-retrieval = "fie.eval.retrieval_runner:main"
eval-agent = "fie.eval.agent_runner:main"
eval-adversarial = "fie.eval.adversarial:main"
eval-seed = "fie.eval.seed:main"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# D1xx: every public module, class and function in `src` says why it exists.
# The pydocstyle *formatting* rules are off on purpose: this repo's docstrings
# open with a summary that wraps when the rationale needs it (D205/D209), and
# they explain decisions rather than command (D401). Enforcing those would
# rewrite ~250 docstrings to satisfy a style nobody reads for. Methods (D102)
# and `__init__` (D107) are off too — a method's class carries the why, and a
# docstring that restates a signature is the kind this repo does not write.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D100", "D101", "D103", "D104", "D419"]

[tool.ruff.lint.per-file-ignores]
# A test's name is its docstring; the ones that need more already have one.
"tests/**" = ["D"]

[tool.mypy]
# Without the plugin, mypy builds pydantic `__init__`s from dataclass_transform,
# which keys parameters by field *alias* and ignores populate_by_name — so every
# LangChain chat-model construction (`ChatAnthropic(model=...)`, whose field is
# `model` aliased `model_name`) read as an unexpected keyword. 25 false errors.
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["fie"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rank_bm25", "edgar", "edgar.*", "fastembed", "fastembed.*", "bs4", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# These modules only run against a live external service (EDGAR) or are eval
# measurement CLIs driven by `uv run eval-*` and
# `deploy/monthly-eval.sh`. The unit suite takes no network and needs no keys
# (see CONVENTIONS), so they cannot execute here — they are covered by the
# eval/ingest runs, not by pytest. Excluded so the reported number measures the
# offline-testable surface. The offline stages they wrap (parse/chunk/facts)
# are tested directly; the load-bearing graph/guardrails/reconcile/state logic
# is not omitted and sits at ~100%.
omit = [
    "src/fie/eval/retrieval_runner.py",
    "src/fie/eval/seed.py",
    "src/fie/eval/perturb.py",
    "src/fie/ingest/fetch.py",
]
