[project]
name = "fie"
version = "0.1.0"
description = "Financial Intelligence Engine — multi-agent verification over SEC filings"
readme = "README.md"
authors = [
    { name = "Arnobgr", email = "90406956+Arnobgr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.42.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.3.5",
    "langfuse>=4.14.0",
    "langgraph>=1.2.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rank-bm25>=0.2.2",
    "typer>=0.27.0",
]

[project.scripts]
fie = "fie.cli:app"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["fie"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rank_bm25", "edgar", "edgar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
