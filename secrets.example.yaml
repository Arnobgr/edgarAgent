# The secret set, with the values removed. Copy to `secrets.enc.yaml` and
# encrypt it (ADR 0029):
#
#     cp secrets.example.yaml secrets.enc.yaml
#     sops --encrypt --in-place secrets.enc.yaml
#     sops secrets.enc.yaml          # edit values from here on
#
# **Every key must be the lowercased name of a field on `fie.config.Settings`.**
# That is the whole contract and it holds by construction rather than by
# convention: `deploy/decrypt-secrets.sh` writes one file per key into
# `secrets/`, compose mounts them at `/run/secrets`, and pydantic-settings
# reads that directory looking for files named after its own fields. A typo
# here does not error — it produces a setting that stays at its default, which
# for `api_key` means the service refuses to boot and for `turnstile_secret_key`
# means it refuses every submission. Loud either way, but check the spelling.
#
# Flat, single-line string values only: the decrypt script parses `key: value`
# a line at a time rather than depending on `yq` being installed on the box.
#
# `anthropic_api_key` is here but is **not** mounted into `fie-api`. It pays
# for the eval judge, which runs from `deploy/monthly-eval.sh` on the host, and
# the serving container has no business holding a key for a model it never
# calls. One encrypted store, two consumers with different subsets — see the
# table in `docs/security.md`.

api_key: generate-with-openssl-rand-hex-32
openrouter_api_key: sk-or-v1-...
openai_api_key: sk-proj-...
anthropic_api_key: sk-ant-...
langfuse_public_key: pk-lf-...
langfuse_secret_key: sk-lf-...
turnstile_secret_key: 0x...
