# The public vhost: https://fie.159-69-91-118.sslip.io
#
# Installed as /etc/nginx/sites-available/fie and symlinked into
# sites-enabled. A new file, not an edit — the four vhosts already on this
# box are untouched (ADR 0035).
#
# **This is the port-80 form.** `certbot --nginx -d fie.159-69-91-118.sslip.io`
# rewrites it in place on the box to add the TLS server block and the
# redirect, so the copy on the VPS diverges from this one after first
# issuance. That is expected: the committed file is what gets nginx to a
# state certbot can work from, not a mirror of the running config.
#
# First issuance can fail for reasons unrelated to us: sslip.io is not on the
# Public Suffix List, so Let's Encrypt counts it as one registered domain and
# the 50-new-certs-per-week limit is shared with every sslip.io user.
# Renewals are exempt, so the three existing certs on this box are safe.
# Retry; do not schedule the deploy against a deadline.

server {
    listen 80;
    listen [::]:80;
    server_name fie.159-69-91-118.sslip.io;

    access_log /var/log/nginx/fie.access.log;
    # fail2ban reads this file for `limiting requests, excess:`.
    error_log /var/log/nginx/fie.error.log;

    # Connections are the scarce resource; slow clients park them for free.
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    limit_conn fie_conn 4;
    limit_conn fie_server 100;

    # The admin surface stays off the public path entirely. The operator reaches it
    # over the tailnet, against the container's loopback bind — an endpoint
    # that reports spend does not need to be internet-reachable just because
    # it happens to sit under the same prefix.
    location /v1/admin/ {
        deny all;
    }

    location = /v1/questions {
        limit_req zone=fie_submit burst=2 nodelay;
        include /etc/nginx/snippets/fie-proxy.conf;
    }

    location /v1/ {
        limit_req zone=fie_poll burst=20 nodelay;
        include /etc/nginx/snippets/fie-proxy.conf;
    }

    # Unlimited on purpose: the external uptime prober is what tells the operator the
    # box is down, and rate-limiting it would manufacture the alert.
    location = /healthz {
        include /etc/nginx/snippets/fie-proxy.conf;
    }

    location / {
        return 404;
    }
}
