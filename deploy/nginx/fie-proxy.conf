# Shared proxy block, installed as /etc/nginx/snippets/fie-proxy.conf.
#
# `X-Real-IP` is the load-bearing line. The API's per-IP quota reads it and
# **not** `X-Forwarded-For`, because `proxy_add_x_forwarded_for` appends to
# whatever the client sent — so the first entry of that header is
# attacker-controlled and a quota keyed on it counts nothing. This directive
# overwrites `X-Real-IP` with `$remote_addr` on every request, and the
# container binds to loopback so nginx is the only route in.

proxy_pass http://127.0.0.1:8412;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Every endpoint returns immediately — runs happen in the background and the
# frontend polls — so a long read timeout would only hold a connection open
# for a request that has already gone wrong.
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
