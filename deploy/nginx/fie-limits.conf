# http-level rate-limit zones for the fie demo.
#
# Installed as /etc/nginx/conf.d/fie-limits.conf. `conf.d` is included from
# the `http` block and was **empty** as of 2026-08-03, so this is an
# additive file: no existing nginx configuration on this box is edited
# (ADR 0035).
#
# The scarce resource here is not RAM. nginx 1.24 runs `worker_processes
# auto` on 2 cores with `worker_connections 768`, so **~1536 connections are
# shared by all six vhosts** — and that is what a flood exhausts first.
#
# ~21 MB of shared memory total, roughly 160k tracked addresses.

# Submissions are rare and expensive: one costs a model call chain and a
# semaphore slot. 3/minute with a burst of 2 is generous for a human and
# fatal for a script.
limit_req_zone $binary_remote_addr zone=fie_submit:5m rate=3r/m;

# Polling is frequent and cheap — the frontend does it while a run is in
# flight — so it gets its own zone rather than being punished by the
# submission rate.
limit_req_zone $binary_remote_addr zone=fie_poll:10m rate=60r/m;

limit_conn_zone $binary_remote_addr zone=fie_conn:5m;

# The one that protects the other five projects. Keyed on $server_name, so it
# bounds *fie's* share of the shared connection pool: a flood on the demo
# cannot starve rec.neighbour-c.example.
limit_conn_zone $server_name zone=fie_server:1m;

# nginx and the API must agree on the contract. The app returns 429 when the
# spend governor, the per-IP quota or the queue cap refuses; nginx returns
# 429 when the load limits do. The bodies differ, which is how the burst
# test in `scripts/burst-test.sh` tells them apart.
limit_req_status 429;
limit_conn_status 429;
